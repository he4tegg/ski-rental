services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wypozyczalnia
      POSTGRES_USER: npi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-npi}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U npi -d wypozyczalnia
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.12.6
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ollama list
      interval: 5s
      retries: 20

  # Jednorazowe pobranie modelu embeddingów (ok. 1,2 GB przy pierwszym starcie, potem z wolumenu).
  ollama-model:
    image: ollama/ollama:0.12.6
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["ollama", "pull", "${EMBEDDING_MODEL:-bge-m3}"]
    depends_on: { ollama: { condition: service_healthy } }

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://npi:${POSTGRES_PASSWORD:-npi}@db:5432/wypozyczalnia
      REDIS_HOST: redis
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_URL: ${WEB_URL:-http://localhost:8088}
      JWT_SECRET: ${JWT_SECRET:?Ustaw JWT_SECRET w pliku .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      PROG_PODOBIENSTWA: ${PROG_PODOBIENSTWA:-0.5}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama-model: { condition: service_completed_successfully }
    healthcheck:
      test: node -e "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      retries: 30

  web:
    build: ./web
    ports: ["${WEB_PORT:-8088}:80"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  db:
  ollama:
